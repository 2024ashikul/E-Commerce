{% extends 'layout.html' %}

{% block body %}
    <form action="api/register" method="post" enctype="multipart/form-data" id="form" >
        <table border="1" cellpadding = '10'>
            <tr>
                <td>Name</td>
                <td><input type="text" name="name" id="name"></td>
            </tr>
            <tr>
                <td>Username</td>
                <td><input type="text" name="username" id="username"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td> <input type="email" name="email" id="email"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td> <input type="password" name="password" id="password"></td>
            </tr>
            <tr>
                <td>Profile Picture</td>
                <td><input type="file" name="file" id="file"></td>
            </tr>
            <tr>
                
                <td colspan="2"><input type="submit"></td>
            </tr>
            
        </table>
     
    </form>

    
    <script>
        document.getElementById("form").addEventListener("submit", function(event) {
            event.preventDefault();
        
            const form = document.getElementById("form");
            const formData = new FormData(form);  // ✅ Automatically collects all form data
        
            fetch('http://127.0.0.1:5000/api/register', {
                method: 'POST',
                body: formData  // ✅ No need to set headers for FormData
            })
            .then(response => response.json())  // ✅ Parse response as JSON
            .then(data => {
                console.log('Success:', data);
                //alert("User registered successfully! Redirecting to login");
                window.location.href = "/login";
            })
            .catch(error => {
                console.error('Error:', error);
                alert("Error registering user.");
            });
        });
        </script>
        


        

{% endblock %}
