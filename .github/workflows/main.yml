name: 🧪 Run Tests (Node.js Backend)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📥 Install Dependencies
        run: |
         cd backend_node
         npm ci

      - name: 🧪 Run Jest Tests
        env:
          NODE_ENV: test
        run: |
          cd backend_node
          npm test -- --runInBand --detectOpenHandles